# xcodegen spec — CI 会执行 `xcodegen generate` 生成 iOSLegacyReader.xcodeproj
name: iOSLegacyReader
options:
  bundleIdPrefix: com.legacydata.reader
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  Kanna:
    url: https://github.com/tid-kijyun/Kanna.git
    from: 5.3.0
targets:
  iOSLegacyReader:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iOSLegacyReader
        excludes:
          - Info.plist
    dependencies:
      - package: Kanna
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legacydata.reader
        PRODUCT_NAME: iOSLegacyReader
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: iOSLegacyReader/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_PORTRAIT: "YES"
        SUPPORTS_LANDSCAPE: "YES"
        VALID_ARCHS: "arm64"
        DEVELOPMENT_TEAM: ""
